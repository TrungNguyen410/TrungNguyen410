name: Profile 3D contributions

on:
  schedule:
    - cron: "0 18 * * *" # 01:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-3d.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # Swap for a PAT secret (repo + read:user) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "chore: refresh 3D contribution graph"; then git push; fi
