<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img">
<style>
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.led{animation:blink 1.6s steps(2,start) infinite}@keyframes blink{50%{opacity:.2}}
.bob{animation:bob 6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.sweep{animation:sweep 5s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(800px)}}</style>
<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a46"/><stop offset="1" stop-color="#0c0c22"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#3ef0c0"/><stop offset="1" stop-color="#3ef0c0" stop-opacity=".15"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
