<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img">
<style>
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.led{animation:blink 1.6s steps(2,start) infinite}@keyframes blink{50%{opacity:.2}}
.bob{animation:bob 6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="bg" cx="72%" cy="38%" r="90%"><stop offset="0" stop-color="#1c1846"/><stop offset=".5" stop-color="#0c0d24"/><stop offset="1" stop-color="#05050d"/></radialGradient>
<linearGradient id="gem" x1="0" x2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset=".55" stop-color="#9b72f2"/><stop offset="1" stop-color="#ff6b9a"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
<clipPath id="typeclip"><rect x="250" y="60" width="0" height="60"><animate attributeName="width" dur="7s" repeatCount="indefinite" values="0;430;430;0" keyTimes="0;.45;.85;1"/></rect></clipPath></defs>
<rect x="200" y="56" width="800" height="68" rx="34" fill="#11122e" stroke="url(#gem)" stroke-width="2.5"/>
<path d="M234 78C235.4 88.6 235.4 88.6 246 90C235.4 91.4 235.4 91.4 234 102C232.6 91.4 232.6 91.4 222 90C232.6 88.6 232.6 88.6 234 78Z" fill="url(#gem)"/>
<g clip-path="url(#typeclip)"><text x="258" y="97" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#eef0ff">Cùng build một thứ gì đó thật xịn nhé!</text></g>
<circle cx="956" cy="90" r="24" fill="url(#gem)"/><path d="M944 90h22m-8 -8l8 8l-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="600" y="168" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#7d88c8">made with JavaScript, a bit of 4D math and lots of ☕ — Sơn Trung Nguyên</text>
</svg>
